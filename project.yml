name: Still
options:
  bundleIdPrefix: com.guythatlives
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Still:
    type: application
    platform: iOS
    sources:
      - Still
      - Shared
    dependencies:
      - target: StillWidgets
        embed: true
      - target: StillWatch
        embed: true
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.guythatlives.still
    info:
      path: Still/Info.plist
      properties:
        CFBundleDisplayName: still.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.guythatlives.still
            CFBundleURLSchemes:
              - still
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: still. uses Face ID to keep your journal private.
        NSMicrophoneUsageDescription: still. records your voice when you choose to speak an entry instead of typing it.
        NSSpeechRecognitionUsageDescription: still. turns your voice entries into text on this iPhone. Nothing is sent anywhere.
        ITSAppUsesNonExemptEncryption: false
        StillAIEndpoint: $(STILL_AI_ENDPOINT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guythatlives.still
        # Cloudflare Worker URL for Quiet AI (see worker/README.md). Empty = cloud option hidden. CI can override with the STILL_AI_ENDPOINT repo variable.
        STILL_AI_ENDPOINT: "https://still.zorbyteofficial.workers.dev"
        # Apple's on-device model is iOS 26+; weak-link so iOS 17–18 still launch.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        PRODUCT_NAME: Still
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  StillWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.guythatlives.still
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: still.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guythatlives.still.widgets
        PRODUCT_NAME: StillWidgets
        TARGETED_DEVICE_FAMILY: "1"

  StillWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - path: Shared/Openers.swift
    dependencies:
      - target: StillWatchWidgets
        embed: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: still.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.guythatlives.still
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guythatlives.still.watchkitapp
        PRODUCT_NAME: StillWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"

  StillWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - path: Shared/Openers.swift
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: still.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guythatlives.still.watchkitapp.widgets
        PRODUCT_NAME: StillWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  Still:
    build:
      targets:
        Still: all
    run:
      config: Debug
    archive:
      config: Release
