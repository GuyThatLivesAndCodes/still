name = "still-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# No request logs or traces are kept for this Worker.
[observability]
enabled = false

[ai]
binding = "AI"

[vars]
# Any Workers AI text model. Small and cheap is plenty for 2–3 sentence notes.
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"

# ~20 requests per minute per IP, per Cloudflare location. Needs Wrangler 4.36+.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 20
  period = 60
